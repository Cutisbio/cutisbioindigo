name: Monthly News Update

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  # Allow manual trigger
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to push the updated message files
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` 를 먼저 쓰고, 락파일이 어긋나면 `npm install` 로 넘어간다.
      #
      # 왜 필요한가: next-intl 이 품은 @swc/core 가 `@swc/helpers >=0.5.17` 을 요구하는데
      # next 는 0.5.15 를 고정한다. 그래서 Linux 에서는 중첩 설치가 필요하고 Windows 에서는
      # 건너뛴다. 개발 PC(Windows)에서 패키지를 하나만 설치해도 락파일에서 그 항목이 빠지고,
      # 그러면 `npm ci` 가 EUSAGE 로 멈춰 **매달 자동 수집이 통째로 실패한다.**
      #
      # 이 작업은 JSON 텍스트만 고쳐 커밋할 뿐 빌드나 배포를 하지 않는다(배포는 Netlify 가
      # 따로 설치해서 수행한다). 재현성보다 매달 안 멈추는 쪽이 중요해서 물러설 길을 둔다.
      - name: Install dependencies
        run: npm ci || (echo "락파일이 어긋나 npm install 로 진행합니다" && npm install)

      # 번역 키는 저장소 시크릿에서 읽는다.
      # Settings → Secrets and variables → Actions → New repository secret
      #   이름: OPENAI_API_KEY
      # 키가 없으면 새 기사만 번역되지 않고 멈춘다. 이미 실린 기사는 그대로 남으므로
      # 사이트가 깨지지는 않지만, 이 단계가 실패로 표시돼 알아챌 수 있다.
      - name: Run News Updater Script
        run: node scripts/update-news.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATE_ENGINE: openai

      # 언어별 기사 수가 어긋나거나 한국어가 다른 언어 파일에 남았으면 여기서 걸러낸다.
      # 커밋 전에 확인해야 반쪽짜리가 배포되지 않는다.
      - name: Verify translations
        run: node scripts/check-blugene-data.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # 후보 목록도 스크립트가 갱신하므로 함께 커밋한다 — 빠뜨리면 다음 달에
          # 승인 표시가 사라진 채로 돌아 실린 기사가 도로 내려간다.
          git add messages/*.json content/news-candidates.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(news): auto-update monthly news" && git push)
