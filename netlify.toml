[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # 운영 도메인. canonical / hreflang / sitemap 이 이 값을 사용한다.
  # 다른 도메인(스테이징 등)에 배포할 때는 Netlify 환경변수로 덮어쓴다.
  NEXT_PUBLIC_BASE_URL = "https://blugene.co"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# www.blugene.co → blugene.co (apex) 로 영구 이동.
# canonical 을 apex 로 통일하기 위한 설정이다.
[[redirects]]
  from = "https://www.blugene.co/*"
  to = "https://blugene.co/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# 이전 도메인(cutisbioindigo.kr) → blugene.co 영구 이동. 2026-09-28 고객 요청으로 켰다.
# blugene.co 가 Netlify 의 Primary domain 이고 canonical · hreflang · sitemap 이 blugene.co 를 가리키므로,
# 옛 주소로 들어온 방문자와 검색엔진을 같은 경로의 새 주소로 보낸다(경로 · 쿼리 유지).
# 옛 주소는 그대로 살아 있어야 하므로(색인된 URL) 도메인을 떼지 말고 이 규칙으로만 넘긴다.
[[redirects]]
  from = "https://cutisbioindigo.kr/*"
  to = "https://blugene.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cutisbioindigo.kr/*"
  to = "https://blugene.co/:splat"
  status = 301
  force = true
